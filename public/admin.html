<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Horas Extras</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; max-width: 720px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; }
    h1 { font-size: 1.4rem; font-weight: 700; }

    .btn-voltar { background: var(--border); color: var(--text); text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; transition: 0.2s; }
    .btn-voltar:hover { background: #475569; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    
    .resumo-grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 12px; align-items: center; }
    .resumo-box { text-align: right; }
    .resumo-box span { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 2px; }
    .resumo-geral strong { font-size: 1.5rem; color: var(--accent); }
    .resumo-mes strong { font-size: 1.65rem; color: var(--success); }

    @media (max-width: 520px) {
      .resumo-grid { grid-template-columns: 1fr 1fr; }
      .resumo-filtro { grid-column: 1 / -1; }
      .resumo-geral { text-align: left; }
    }

    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem; margin-bottom: 12px; }
    input:focus { outline: none; border-color: var(--primary); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    .btn-group { display: flex; gap: 8px; }
    button { padding: 10px 16px; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: var(--primary); color: #fff; flex: 1; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-sm { padding: 6px 10px; font-size: 0.8rem; }
    .btn-edit { background: #334155; color: #38bdf8; }
    .btn-del { background: #334155; color: #f87171; }

    .lista-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 10px; }
    .lista-item:last-child { border-bottom: none; }
    .item-info { flex: 1; }
    .item-data { font-weight: 600; font-size: 1rem; }
    .item-obs { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    .item-horas { font-weight: 700; font-size: 1.1rem; color: var(--primary); margin-right: 12px; white-space: nowrap; }
    .badge-alerta { background: rgba(245, 158, 11, 0.15); color: var(--warning); font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; margin-left: 6px; border: 1px solid rgba(245, 158, 11, 0.3); }

    .vazio { text-align: center; color: var(--muted); padding: 24px 0; font-size: 0.95rem; }
  </style>
</head>
<body>

  <header>
    <h1>Gerenciar Horas</h1>
    <a href="/" class="btn-voltar">Visão Geral</a>
  </header>

  <div class="card resumo-grid">
    <div class="resumo-filtro">
      <label for="filtroMes">Mês de Referência</label>
      <input type="month" id="filtroMes" style="margin-bottom: 0;">
    </div>
    <div class="resumo-box resumo-geral">
      <span>Total Geral</span>
      <strong id="totalGeral">00:00</strong>
    </div>
    <div class="resumo-box resumo-mes">
      <span>Total no Mês</span>
      <strong id="totalMes">00:00</strong>
    </div>
  </div>

  <div class="card">
    <h2 id="formTitulo" style="font-size: 1rem; margin-bottom: 12px; color: var(--muted);">Novo Lançamento</h2>
    <form id="formHoras">
      <input type="hidden" id="registroId">
      <div class="form-row">
        <div>
          <label for="data">Dia</label>
          <input type="date" id="data" required>
        </div>
        <div>
          <label for="horas">Quantidade (HH:MM)</label>
          <input type="time" id="horas" value="02:00" required>
        </div>
      </div>
      <div>
        <label for="observacao">Observação (opcional)</label>
        <input type="text" id="observacao" placeholder="Ex: Cobrindo turno / Manutenção">
      </div>
      <div class="btn-group">
        <button type="submit" class="btn-primary" id="btnSalvar">Salvar Lançamento</button>
        <button type="button" class="btn-secondary" id="btnCancelar" style="display: none;">Cancelar</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2 style="font-size: 1rem; margin-bottom: 8px; color: var(--muted);">Registros do Mês</h2>
    <div id="listaRegistros"></div>
  </div>

  <script>
    let todosRegistros = [];

    const filtroMesInput = document.getElementById('filtroMes');
    const totalGeralEl = document.getElementById('totalGeral');
    const totalMesEl = document.getElementById('totalMes');
    const listaEl = document.getElementById('listaRegistros');
    const form = document.getElementById('formHoras');
    const registroIdInput = document.getElementById('registroId');
    const dataInput = document.getElementById('data');
    const horasInput = document.getElementById('horas');
    const obsInput = document.getElementById('observacao');
    const formTitulo = document.getElementById('formTitulo');
    const btnSalvar = document.getElementById('btnSalvar');
    const btnCancelar = document.getElementById('btnCancelar');

    const hoje = new Date();
    const anoAtual = hoje.getFullYear();
    const mesAtual = String(hoje.getMonth() + 1).padStart(2, '0');
    const diaAtual = String(hoje.getDate()).padStart(2, '0');
    
    filtroMesInput.value = `${anoAtual}-${mesAtual}`;
    dataInput.value = `${anoAtual}-${mesAtual}-${diaAtual}`;

    function hhmmParaMinutos(hhmm) {
      const [h, m] = hhmm.split(':').map(Number);
      return (h * 60) + m;
    }

    function minutosParaHHMM(totalMinutos) {
      const h = Math.floor(totalMinutos / 60);
      const m = totalMinutos % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function formatarDataBR(dataISO) {
      const [ano, mes, dia] = dataISO.split('-');
      return `${dia}/${mes}/${ano}`;
    }

    async function carregarRegistros() {
      const res = await fetch('/api/horas');
      todosRegistros = await res.json();
      renderizar();
    }

    function renderizar() {
      // Soma geral de todos os meses cadastrados
      const somaGeralMinutos = todosRegistros.reduce((acc, item) => acc + item.minutos, 0);
      totalGeralEl.textContent = minutosParaHHMM(somaGeralMinutos);

      // Filtra e soma apenas o mês selecionado
      const mesSelecionado = filtroMesInput.value;
      const filtrados = todosRegistros.filter(r => r.data.startsWith(mesSelecionado));

      const somaMesMinutos = filtrados.reduce((acc, item) => acc + item.minutos, 0);
      totalMesEl.textContent = minutosParaHHMM(somaMesMinutos);

      if (filtrados.length === 0) {
        listaEl.innerHTML = '<div class="vazio">Nenhuma hora extra lançada neste mês.</div>';
        return;
      }

      listaEl.innerHTML = filtrados.map(item => {
        const alerta = item.minutos > 120 ? '<span class="badge-alerta">+2h no dia</span>' : '';
        return `
          <div class="lista-item">
            <div class="item-info">
              <div class="item-data">${formatarDataBR(item.data)} ${alerta}</div>
              ${item.observacao ? `<div class="item-obs">${item.observacao}</div>` : ''}
            </div>
            <div class="item-horas">${minutosParaHHMM(item.minutos)}</div>
            <div class="btn-group">
              <button class="btn-sm btn-edit" onclick="editarRegistro('${item.id}')">Editar</button>
              <button class="btn-sm btn-del" onclick="deletarRegistro('${item.id}')">Excluir</button>
            </div>
          </div>
        `;
      }).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = registroIdInput.value;
      const payload = {
        data: dataInput.value,
        minutos: hhmmParaMinutos(horasInput.value),
        observacao: obsInput.value
      };

      const res = id
        ? await fetch(`/api/horas/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          })
        : await fetch('/api/horas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

      if (!res.ok) {
        alert('Erro ao salvar registro. Verifique os dados ou sua autenticação.');
        return;
      }

      filtroMesInput.value = payload.data.slice(0, 7);
      resetarFormulario();
      carregarRegistros();
    });

    window.editarRegistro = function(id) {
      const item = todosRegistros.find(r => r.id === id);
      if (!item) return;

      registroIdInput.value = item.id;
      dataInput.value = item.data;
      horasInput.value = minutosParaHHMM(item.minutos);
      obsInput.value = item.observacao;

      formTitulo.textContent = 'Editando Lançamento';
      btnSalvar.textContent = 'Atualizar';
      btnCancelar.style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deletarRegistro = async function(id) {
      if (!confirm('Deseja realmente excluir este lançamento?')) return;
      const res = await fetch(`/api/horas/${id}`, { method: 'DELETE' });
      if (!res.ok) {
        alert('Erro ao excluir registro.');
        return;
      }
      carregarRegistros();
    };

    function resetarFormulario() {
      registroIdInput.value = '';
      horasInput.value = '02:00';
      obsInput.value = '';
      formTitulo.textContent = 'Novo Lançamento';
      btnSalvar.textContent = 'Salvar Lançamento';
      btnCancelar.style.display = 'none';
    }

    btnCancelar.addEventListener('click', resetarFormulario);
    filtroMesInput.addEventListener('change', renderizar);

    carregarRegistros();
  </script>
</body>
</html>
